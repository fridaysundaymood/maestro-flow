name: Publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: maestro-flow
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: fridaysundaymood/android-kit
          path: android-kit
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: fridaysundaymood/emu-lab
          path: emu-lab
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check release version
        working-directory: maestro-flow
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import { readFileSync } from "node:fs"; const version = JSON.parse(readFileSync("package.json")).version; if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("Release tag must match package version");'
      - run: npm ci --include-workspace-root --workspace=@budaknyenyel/kit-schema && npm run build --workspace=@budaknyenyel/kit-schema
        working-directory: android-kit
      - run: npm ci && npm run build
        working-directory: emu-lab
      - run: npm ci && npm run build
        working-directory: maestro-flow
      - name: Publish staged package
        working-directory: maestro-flow
        run: |
          staging="$(node scripts/prepare-publish.mjs)"
          trap 'rm -rf "$staging"' EXIT
          npm publish "$staging" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
